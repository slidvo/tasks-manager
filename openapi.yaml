openapi: 3.0.3
info:
  title: Tasks Manager API
  version: 1.0.0

servers:
  - url: http://localhost:3000/api

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        name:
          type: string
          example: Женя Потапов
        email:
          type: string
          format: email
          example: potapovpro@mail.ru
      required:
        - name
        - email

    Project:
      type: object
      properties:
        name:
          type: string
          example: Новый проект
        description:
          type: string
          example: Описание нового проекта
      required:
        - name

    Task:
      type: object
      properties:
        name:
          type: string
          example: Сделать авторизацию
        description:
          type: string
          example: Реализовать JWT авторизацию
        deadline:
          type: string
          format: date-time
          example: "2026-06-01T00:00:00.000Z"
      required:
        - name
        - deadline

    TaskStatus:
      type: string
      enum:
        - CREATED
        - IN_PROGRESS
        - DONE

    TimeSheetEntry:
      type: object
      properties:
        id:
          type: integer
        spent_time:
          type: integer
          nullable: true
          description: Затраченное время в минутах
        date:
          type: string
          format: date-time
        userName:
          type: string
          nullable: true
        taskName:
          type: string

    ProjectTimeSheetEntry:
      type: object
      properties:
        userName:
          type: string
          nullable: true
        totalSpentTime:
          type: integer
          description: Суммарное время в минутах

    Error:
      type: object
      properties:
        message:
          type: string

paths:

  # ── Auth ────────────────────────────────────────────────────────────────── #

  /auth/register:
    post:
      summary: Регистрация нового пользователя
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  $ref: '#/components/schemas/User'
              required:
                - user
            example:
              user:
                name: Женя Потапов
                email: potapovpro@mail.ru
      responses:
        "201":
          description: Пользователь создан
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  email:
                    type: string
        "400":
          description: Некорректные данные запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      summary: Вход в систему
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
              required:
                - email
                - password
            example:
              email: potapovpro@mail.ru
              password: secret
      responses:
        "200":
          description: Успешный вход, возвращает JWT токен
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        "401":
          description: Неверные учётные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Users ───────────────────────────────────────────────────────────────── #

  /users/all:
    get:
      summary: Получить список всех пользователей
      tags:
        - Users
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Список пользователей
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        "401":
          description: Не авторизован

  /users/add:
    post:
      summary: Добавить пользователя
      tags:
        - Users
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  $ref: '#/components/schemas/User'
              required:
                - user
      responses:
        "201":
          description: Пользователь добавлен
        "400":
          description: Некорректные данные запроса
        "401":
          description: Не авторизован

  /users/update:
    put:
      summary: Обновить данные пользователя
      tags:
        - Users
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  $ref: '#/components/schemas/User'
              required:
                - user
      responses:
        "200":
          description: Данные обновлены
        "400":
          description: Некорректные данные запроса
        "401":
          description: Не авторизован

  /users/delete/{id}:
    delete:
      summary: Удалить пользователя
      tags:
        - Users
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: Пользователь удалён
        "401":
          description: Не авторизован

  # ── Projects ────────────────────────────────────────────────────────────── #

  /projects:
    post:
      summary: Создать проект
      tags:
        - Projects
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                project:
                  $ref: '#/components/schemas/Project'
              required:
                - project
            example:
              project:
                name: Новый проект
                description: Описание нового проекта
      responses:
        "201":
          description: Проект создан
          content:
            application/json:
              schema:
                type: object
                properties:
                  project:
                    allOf:
                      - $ref: '#/components/schemas/Project'
                      - type: object
                        properties:
                          id:
                            type: integer
        "401":
          description: Не авторизован

  /projects/info:
    get:
      summary: Получить информацию о всех проектах текущего пользователя
      tags:
        - Projects
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Список проектов
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Project'
                        - type: object
                          properties:
                            id:
                              type: integer
        "401":
          description: Не авторизован

  /projects/{projectId}/tasks:
    post:
      summary: Добавить задачу в проект
      tags:
        - Projects
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                task:
                  $ref: '#/components/schemas/Task'
              required:
                - task
            example:
              task:
                name: Реализовать авторизацию
                description: JWT авторизация через Bearer token
                deadline: "2026-06-01T00:00:00.000Z"
      responses:
        "201":
          description: Задача создана
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:
                    allOf:
                      - $ref: '#/components/schemas/Task'
                      - type: object
                        properties:
                          id:
                            type: integer
                          status:
                            $ref: '#/components/schemas/TaskStatus'
        "401":
          description: Не авторизован

  # ── Tasks ───────────────────────────────────────────────────────────────── #

  /tasks/{taskId}/assign:
    put:
      summary: Назначить исполнителя задачи (текущий авторизованный пользователь)
      tags:
        - Tasks
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: Исполнитель назначен
        "401":
          description: Не авторизован

  /tasks/{taskId}/status:
    patch:
      summary: Обновить статус задачи
      description: Только назначенный исполнитель задачи может менять её статус.
      tags:
        - Tasks
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  $ref: '#/components/schemas/TaskStatus'
              required:
                - status
            example:
              status: IN_PROGRESS
      responses:
        "200":
          description: Статус обновлён
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:
                    allOf:
                      - $ref: '#/components/schemas/Task'
                      - type: object
                        properties:
                          id:
                            type: integer
                          status:
                            $ref: '#/components/schemas/TaskStatus'
        "401":
          description: Не авторизован
        "403":
          description: Нет прав на изменение статуса

  # ── TimeSheets ──────────────────────────────────────────────────────────── #

  /timesheets/{userId}:
    get:
      summary: Время работы одного разработчика
      description: Возвращает записи о времени работы указанного пользователя с опциональной фильтрацией по проекту и периоду.
      tags:
        - TimeSheets
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
          example: 1
        - name: projectId
          in: query
          required: false
          schema:
            type: integer
          description: Фильтр по проекту
          example: 3
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Начало периода (включительно)
          example: "2026-04-01"
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Конец периода (включительно)
          example: "2026-04-30"
      responses:
        "200":
          description: Записи о времени работы
          content:
            application/json:
              schema:
                type: object
                properties:
                  timeSheets:
                    type: array
                    items:
                      $ref: '#/components/schemas/TimeSheetEntry'
        "401":
          description: Не авторизован

  /timesheets/projects/{projectId}:
    get:
      summary: Общее время работы над проектом с разбивкой по разработчикам
      description: Возвращает суммарное затраченное время каждого разработчика на указанный проект за указанный период.
      tags:
        - TimeSheets
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
          example: 5
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Начало периода (включительно)
          example: "2026-04-01"
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Конец периода (включительно)
          example: "2026-04-30"
      responses:
        "200":
          description: Суммарное время по разработчикам
          content:
            application/json:
              schema:
                type: object
                properties:
                  projectName:
                    type: string
                    example: Новый проект
                  timeSheets:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProjectTimeSheetEntry'
              example:
                projectName: Новый проект
                timeSheets:
                  - userName: Женя Потапов
                    totalSpentTime: 210
                  - userName: Другой разраб
                    totalSpentTime: 60
        "401":
          description: Не авторизован
